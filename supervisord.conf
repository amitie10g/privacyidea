[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/var/run/supervisord.pid

# privacyIDEA behind gunicorn (production WSGI server). It must listen on 0.0.0.0,
# otherwise the published port is unreachable from outside the container. The
# config file is taken from PRIVACYIDEA_CONFIGFILE (exported by the entrypoint).
# Keep few workers while the database is SQLite (writes are serialized).
[program:privacyidea]
command=/opt/privacyidea/venv/bin/gunicorn --chdir /opt/privacyidea --bind 0.0.0.0:5000 --workers 2 --access-logfile - --error-logfile - "privacyidea.app:create_app(config_name='production')"
directory=/opt/privacyidea
priority=10
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

# FreeRADIUS with the privacyIDEA plugin. Started only if RADIUS_CLIENTS is set
# (entrypoint exports RADIUS_AUTOSTART and FR_ARGS). The plugin queries
# privacyIDEA on every request, so it does not need to wait for it at startup.
[program:freeradius]
command=/usr/sbin/freeradius %(ENV_FR_ARGS)s
autostart=%(ENV_RADIUS_AUTOSTART)s
priority=20
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true